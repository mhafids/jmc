name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build & Compile
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt application
        run: npm run build
        env:
          NODE_ENV: production

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/root/jmc' }}"
            echo "Navigating to app directory: $APP_DIR"
            cd "$APP_DIR"

            echo "Pulling latest changes..."
            git fetch origin main
            git reset --hard origin/main

            echo "Installing dependencies..."
            if command -v bun >/dev/null 2>&1; then
              bun install
              echo "Building Nuxt app..."
              bun run build
            elif command -v npm >/dev/null 2>&1; then
              npm install
              echo "Building Nuxt app..."
              npm run build
            fi

            echo "Restarting application with PM2..."
            PM2_BIN=$(which pm2 || echo "/root/.bun/bin/pm2")
            if [ -x "$PM2_BIN" ]; then
              $PM2_BIN reload jmc-app || $PM2_BIN start .output/server/index.mjs --name jmc-app || $PM2_BIN restart 0
              $PM2_BIN save
            else
              echo "PM2 not found, running directly or check configuration."
            fi

            echo "Deployment finished successfully!"
