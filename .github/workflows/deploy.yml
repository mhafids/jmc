name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Compress build output
        run: |
          tar -czf output.tar.gz .output
      - name: Transfer and Extract to VPS
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          PORT="${{ secrets.SSH_PORT || '22' }}"
          USER="${{ secrets.SSH_USER }}"
          HOST="${{ secrets.SSH_HOST }}"
          TARGET_DIR="${{ secrets.APP_DIR || '/root/jmc' }}"

          echo "Ensuring remote directory exists..."
          ssh -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_deploy "$USER@$HOST" "mkdir -p $TARGET_DIR"

          echo "Streaming and extracting output.tar.gz to VPS..."
          ssh -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_deploy "$USER@$HOST" "rm -rf $TARGET_DIR/.output"
          ssh -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_deploy "$USER@$HOST" "tar -xzf - -C $TARGET_DIR" < output.tar.gz

          echo "Restarting application with PM2..."
          ssh -o StrictHostKeyChecking=no -p "$PORT" -i ~/.ssh/id_deploy "$USER@$HOST" "bash -l -c '
            cd $TARGET_DIR
            if command -v pm2 >/dev/null 2>&1; then
              pm2 reload jmc-app || pm2 start .output/server/index.mjs --name jmc-app || pm2 restart jmc-app
              pm2 save
            elif [ -x /root/.bun/bin/pm2 ]; then
              /root/.bun/bin/pm2 reload jmc-app || /root/.bun/bin/pm2 start .output/server/index.mjs --name jmc-app || /root/.bun/bin/pm2 restart jmc-app
              /root/.bun/bin/pm2 save
            else
              echo \"PM2 not found in PATH or standard location.\"
            fi
          '"

          rm -f ~/.ssh/id_deploy
          echo "Deployment finished successfully!"

