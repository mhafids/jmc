name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Latest LTS 22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Nuxt application
        run: npm run build
        env:
          NODE_ENV: production

      - name: Sync .output to VPS via rsync
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          ARGS: "-rlgoDzvc -i --delete"
          SOURCE: ".output/"
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT || 22 }}
          TARGET: "${{ secrets.APP_DIR || '/root/jmc' }}/.output"
          EXCLUDE: "/.git/, /node_modules/"

      - name: Restart PM2 on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.APP_DIR || '/root/jmc' }}"
            cd "$APP_DIR"

            PM2_BIN=$(which pm2 || echo "/root/.bun/bin/pm2" || echo "pm2")
            echo "Reloading application with PM2..."
            if [ -x "$PM2_BIN" ] || command -v pm2 >/dev/null 2>&1; then
              pm2 reload jmc-app || pm2 start .output/server/index.mjs --name jmc-app || pm2 restart jmc-app
              pm2 save
            else
              echo "PM2 not found. Please ensure PM2 is installed globally on the VPS."
            fi

            echo "Deployment finished successfully!"

